<!-- Simplified sibling of AppLogo.vue: same yellow tile, same hub-and-spoke
     mark, but seven spokes and no second level. The full logo's sub-branches
     measure well under a pixel at 16px and collapse into a smudge. Strokes and
     nodes are chunkier here for the same reason. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="8" fill="#f7df1e"/>
  <g fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round">
    <path d="M32 32 L50.6 36"/>
    <path d="M32 32 L39.3 45.7"/>
    <path d="M32 32 L23.5 47.9"/>
    <path d="M32 32 L17.8 35"/>
    <path d="M32 32 L15.5 21.7"/>
    <path d="M32 32 L29.7 15.7"/>
    <path d="M32 32 L43.7 19"/>
  </g>
  <g fill="#000">
    <circle cx="50.6" cy="36" r="4.4"/>
    <circle cx="39.3" cy="45.7" r="3.2"/>
    <circle cx="23.5" cy="47.9" r="4"/>
    <circle cx="17.8" cy="35" r="3"/>
    <circle cx="15.5" cy="21.7" r="4.6"/>
    <circle cx="29.7" cy="15.7" r="3.6"/>
    <circle cx="43.7" cy="19" r="4.2"/>
  </g>
  <circle cx="32" cy="32" r="7.5" fill="#000"/>
</svg>
